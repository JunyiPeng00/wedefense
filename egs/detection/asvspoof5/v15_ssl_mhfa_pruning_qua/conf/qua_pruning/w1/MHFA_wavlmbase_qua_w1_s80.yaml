### train configuraton - Fixed 1-bit quantization

exp_dir: exp/qua_fixed/MHFA_wavlmbase_qua_w1_fixed
gpus: "[0,1]"
num_avg: 2
enable_amp: False # whether enable automatic mixed precision training

seed: 42
num_epochs: 10  # Increased for better convergence
save_epoch_interval: 1 # save model every epoch
log_batch_interval: 50 # log every 50 batches for more frequent monitoring

dataloader_args:
  batch_size: 32
  num_workers: 6
  pin_memory: False
  prefetch_factor: 8 
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 0
  shuffle: True
  shuffle_args:
    shuffle_size: 2500
  filter: True
  filter_args:
    min_num_frames: 50
    max_num_frames: 400
  resample_rate: 16000
  speed_perturb: False
  num_frms: 150
  aug_prob: 0.8 # prob to add reverb & noise aug per sample
  frontend: "huggingface" # fbank, s3prl
  huggingface_args:
    upstream_args:
      name: "wavlm_base"
      path_or_url: "./convert/"
      pruning_units: ""
    frozen: False
    frame_shift: 20
    frame_length: 20
  cmvn: True
  cmvn_args:
    norm_mean: True
    norm_var: False
  spec_aug: False
  spec_aug_args:
    num_t_mask: 1
    num_f_mask: 1
    max_t: 10
    max_f: 8
    prob: 0.6

model: SSL_BACKEND_MHFA # starts from SSL_BACKEND (as defined in models/get_model.py) 
model_init: null
model_args:
  feat_dim: -1
  head_nb: 32
  embed_dim: 256
  compression_dim: 128
  feature_grad_mult: 0.1
  nb_layer: 13
projection_args:
  project_type: "softmax" # add_margin, arc_margin, sphere, sphereface2, softmax, arc_margin_intertopk_subcenter
  scale: 32.0
  easy_margin: False

use_pruning_loss: True # whether use pruning loss, if True, the pruning loss will be added to the training loss
target_sparsity: 0.8
initial_reg_lr: 5.0e-2
sparsity_warmup_epochs: 5

# FIXED: Quantization settings for 1-bit
use_quantization: True
quantization_config: '1bit_symmetric'  # Now properly supports {-1, +1} levels
quantize_weights: True
quantize_bias: False  # Keep bias unquantized for stability
quantize_activations: False  # Keep activations unquantized for 1-bit
preserve_hp_gating: True

# FIXED: LSQ training parameters
per_channel_weights: True  # Per-channel quantization for better accuracy
per_channel_activations: False
freeze_lsq_steps: 0  # No freezing - start training step_size immediately
lsq_step_lr: 1.0e-4  # Increased from 1e-5 to match main learning rate
grad_clip_norm: 1.0

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.0
  increase_start_epoch: 20
  fix_start_epoch: 40
  update_margin: True
  increase_type: "exp" # exp, linear

loss: CrossEntropyLoss
loss_args: {}

optimizer: AdamW
optimizer_args:
  weight_decay: 1.0e-7

# FIXED: Learning rate schedule for 1-bit
scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 5.0e-4  # Increased from 1e-5 for better convergence
  final_lr: 1.0e-5   # Gentle decay
  warm_up_epoch: 3   # Longer warmup for stability
  warm_from_zero: True
